<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Dillon</title>
</head>

<body style="text-align:center; font-family:Arial; padding-top:60px;">

  <h1>TEXT DILLON</h1>

  <p>Questions about this vehicle?</p>

  <a id="textButton"
     style="display:inline-block;padding:20px 35px;background:#1877F2;color:white;text-decoration:none;font-size:24px;font-weight:bold;border-radius:10px;">
     📲 TEXT ME — CLICK HERE
  </a>

  <p style="margin-top:25px;">Call/Text: <strong>717-414-6101</strong></p>

<script>
  const params = new URLSearchParams(window.location.search);
  const vehicle = params.get("vehicle");

  let message;

  if (vehicle) {
    message = "Hi Dillon! I'm interested in the " + vehicle +
              " I saw on Facebook Marketplace. Is it still available?";
  } else {
    message = "Hi Dillon! I saw one of your vehicles on Facebook Marketplace. Is it still available?";
  }

  document.getElementById("textButton").href =
    "sms:+7174146101?body=" + encodeURIComponent(message);
</script>

</body>
</html>
